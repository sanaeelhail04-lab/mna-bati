<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Réalisations · M.N.A BATI</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- 1️⃣ Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2️⃣ Config -->
  <script src="config.js"></script>

  <!-- 3️⃣ 🔒 GARDE D'AUTHENTIFICATION -->
  <script>
    (function () {
      'use strict';
      const LOGIN_PAGE = 'login.html';

      document.documentElement.style.visibility = 'hidden';

      async function checkAuth() {
        const client = window.MNA && window.MNA.getClient();
        if (!client) {
          console.error('❌ Client Supabase indisponible');
          window.location.replace(LOGIN_PAGE);
          return;
        }

        try {
          const { data: { session }, error } = await client.auth.getSession();

          if (error || !session || !session.user) {
            console.warn('🔒 Non connecté → redirection login');
            window.location.replace(LOGIN_PAGE);
            return;
          }

          const { data: profile } = await client
            .from('profiles')
            .select('role, is_active')
            .eq('id', session.user.id)
            .maybeSingle();

          if (profile && profile.is_active === false) {
            await client.auth.signOut();
            window.location.replace(LOGIN_PAGE);
            return;
          }

          if (profile && profile.role && profile.role !== 'admin') {
            await client.auth.signOut();
            window.location.replace(LOGIN_PAGE);
            return;
          }

          console.log('✅ Auth OK :', session.user.email);

          document.documentElement.style.visibility = '';
          window.__MNA_AUTH_OK__ = true;
          document.dispatchEvent(new Event('mna-auth-ok'));

        } catch (err) {
          console.error('❌ Auth error:', err);
          window.location.replace(LOGIN_PAGE);
        }
      }

      checkAuth();
    })();
  </script>

  <style>
    :root {
      --navy: #0d3b5c;
      --navy-dark: #082c47;
      --navy-deep: #051c2e;
      --navy-black: #02111d;
      --teal: #0096ab;
      --teal-light: #00b4cc;
      --gold: #f4b942;
      --coral: #eb4046;
      --green: #25d366;
      --white: #ffffff;
      --text-light: #cbd5e1;
      --text-muted: #94a3b8;
      --border: rgba(0,150,171,0.2);
      --font: 'Poppins', system-ui, sans-serif;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --transition: 0.25s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--navy-deep);
      color: var(--white);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: var(--font); }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--navy-deep); }
    ::-webkit-scrollbar-thumb { background: rgba(0,150,171,0.4); border-radius: 4px; }

    /* HEADER */
    .top-header {
      max-width: 1200px; margin: 0 auto 2rem;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.9rem; }
    .brand .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--teal), #006e82);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--white); font-family: var(--font-display);
      font-weight: 800; font-size: 1.2rem;
      box-shadow: 0 10px 25px rgba(0,150,171,0.4);
    }
    .brand h1 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; line-height: 1.1; }
    .brand span { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal-light); }

    .header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.4rem; border-radius: 9999px;
      font-weight: 700; font-size: 0.85rem;
      transition: var(--transition); cursor: pointer;
      border: none; font-family: var(--font); white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--teal), #006e82);
      color: var(--white);
      box-shadow: 0 8px 20px rgba(0,150,171,0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,150,171,0.5);
      background: linear-gradient(135deg, var(--teal-light), var(--teal));
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--white);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); border-color: var(--teal); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-light);
      padding: 0.5rem 0.9rem;
      font-size: 0.8rem;
    }
    .btn-ghost:hover { background: rgba(0,150,171,0.1); border-color: var(--teal); color: var(--white); }
    .btn-sm { padding: 0.5rem 0.9rem; font-size: 0.78rem; }
    .btn-icon {
      width: 34px; height: 34px;
      padding: 0; justify-content: center; border-radius: 9px;
    }
    .btn-danger { color: var(--coral) !important; }
    .btn-danger:hover { background: rgba(235,64,70,0.15) !important; border-color: var(--coral) !important; }

    .connection-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      background: rgba(37,211,102,0.1);
      border: 1px solid rgba(37,211,102,0.3);
      border-radius: 9999px;
      font-size: 0.75rem; font-weight: 600; color: #4ade80;
    }
    .connection-badge i { font-size: 0.5rem; }
    .connection-badge.offline {
      background: rgba(235,64,70,0.1);
      border-color: rgba(235,64,70,0.3);
      color: #ff8b8f;
    }

    /* LOADER */
    .global-loader {
      position: fixed; inset: 0;
      background: rgba(2,17,29,0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem;
    }
    .global-loader.active { display: flex; }
    .global-loader .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(0,150,171,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .container { max-width: 1200px; margin: 0 auto; }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: linear-gradient(160deg, rgba(13,59,92,0.7), rgba(5,28,46,0.9));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.3rem 1.2rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .stat-card:hover {
      border-color: rgba(0,150,171,0.5);
      transform: translateY(-3px);
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 40%; height: 2px;
      background: linear-gradient(90deg, var(--teal), transparent);
    }
    .stat-card .stat-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(0,150,171,0.15);
      border: 1px solid rgba(0,150,171,0.3);
      color: var(--teal-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }
    .stat-card .stat-value {
      font-family: var(--font-display);
      font-size: 1.8rem; font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--teal-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.3rem;
      letter-spacing: -0.03em;
    }
    .stat-card .stat-label {
      font-size: 0.78rem; color: var(--text-light); font-weight: 500;
    }

    /* FILTERS */
    .filters-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .filter-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-light);
      transition: var(--transition);
    }
    .filter-btn:hover { background: rgba(0,150,171,0.1); border-color: var(--teal); color: var(--white); }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--teal), #006e82);
      border-color: var(--teal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(0,150,171,0.3);
    }
    .filter-btn .count {
      background: rgba(255,255,255,0.15);
      padding: 0.1rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.7rem;
    }
    .filter-btn.active .count {
      background: rgba(255,255,255,0.25);
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }
    .search-wrap i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--teal-light);
      font-size: 0.85rem;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      background: rgba(2,17,29,0.5);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--white);
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,150,171,0.18);
    }

    /* CARDS GRID */
    .card {
      background: rgba(13,59,92,0.4);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.2rem; padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 1rem;
    }
    .card-header h2 {
      font-family: var(--font-display);
      font-size: 1.1rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .card-header h2 i { color: var(--teal-light); }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .project-item {
      background: rgba(2,17,29,0.5);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: var(--transition);
      display: flex; flex-direction: column;
    }
    .project-item:hover {
      border-color: rgba(0,150,171,0.5);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }
    .project-img {
      aspect-ratio: 4/3;
      background-size: cover;
      background-position: center;
      background-color: var(--navy-dark);
      position: relative;
    }
    .project-img::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(2,17,29,0.85) 100%);
    }
    .project-cat {
      position: absolute; top: 0.7rem; left: 0.7rem;
      z-index: 2;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      backdrop-filter: blur(10px);
      background: rgba(0,150,171,0.95);
      color: #fff;
    }
    .project-cat.villa { background: rgba(0,150,171,0.95); }
    .project-cat.piscine { background: rgba(37,211,102,0.95); }
    .project-cat.extension { background: rgba(244,185,66,0.95); color: var(--navy-black); }
    .project-cat.maconnerie { background: rgba(235,64,70,0.95); }
    .project-cat.amenagement { background: rgba(148,163,184,0.95); }

    .project-year-badge {
      position: absolute; top: 0.7rem; right: 0.7rem;
      z-index: 2;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.7rem; font-weight: 700;
      background: rgba(2,17,29,0.75);
      color: #fff;
      backdrop-filter: blur(10px);
      font-family: var(--font-display);
    }
    .project-status {
      position: absolute; bottom: 0.7rem; right: 0.7rem;
      z-index: 2;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      backdrop-filter: blur(10px);
    }
    .project-status.published { background: rgba(37,211,102,0.9); color: #fff; }
    .project-status.draft { background: rgba(148,163,184,0.9); color: #fff; }

    .project-body {
      padding: 1.1rem 1.2rem 1.2rem;
      display: flex; flex-direction: column;
      gap: 0.5rem; flex-grow: 1;
    }
    .project-body h3 {
      font-family: var(--font-display);
      font-size: 1rem; font-weight: 700;
      color: var(--white); line-height: 1.3;
    }
    .project-loc {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 0.35rem;
    }
    .project-loc i { color: var(--teal-light); font-size: 0.7rem; }
    .project-specs-mini {
      font-size: 0.75rem;
      color: var(--text-light);
      display: flex; flex-wrap: wrap; gap: 0.6rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .project-specs-mini span {
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .project-specs-mini i { color: var(--teal-light); font-size: 0.65rem; }

    .project-actions {
      display: flex; gap: 0.4rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .project-actions .btn { flex: 1; justify-content: center; }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state i {
      font-size: 2.5rem; opacity: 0.4; margin-bottom: 1rem;
    }
    .empty-state p { font-size: 0.9rem; margin-bottom: 0.3rem; }
    .empty-state small { font-size: 0.78rem; opacity: 0.7; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(2,17,29,0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      padding: 2rem 1rem;
      overflow-y: auto;
      justify-content: center; align-items: flex-start;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      width: 100%; max-width: 640px;
      background: var(--navy-deep);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 2rem 1.8rem;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      margin: auto;
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 1.2rem; margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.2rem; font-weight: 700;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .modal-header h2 i { color: var(--teal-light); }
    .modal-close {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text-light);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      font-size: 0.95rem;
    }
    .modal-close:hover { background: rgba(235,64,70,0.15); color: #ff8b8f; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-field { margin-bottom: 1rem; }
    .form-field label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--text-light); margin-bottom: 0.4rem;
    }
    .form-field label .req { color: var(--coral); }
    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%; padding: 0.75rem 1rem;
      background: rgba(2,17,29,0.5);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--white); font-size: 0.88rem;
      transition: var(--transition); outline: none;
    }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,150,171,0.18);
    }
    .form-field textarea { resize: vertical; min-height: 90px; }
    .form-field small {
      display: block; font-size: 0.7rem;
      color: var(--text-muted); margin-top: 0.3rem;
    }

    .img-preview {
      margin-top: 0.6rem;
      aspect-ratio: 16/9;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-color: var(--navy-dark);
      border: 1px solid var(--border);
      display: none;
    }
    .img-preview.show { display: block; }

    .modal-actions {
      display: flex; gap: 0.7rem; justify-content: flex-end;
      padding-top: 1.5rem; margin-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    /* TOAST */
    .toast-container {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      z-index: 10000;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .toast {
      background: rgba(13,59,92,0.95);
      border: 1px solid var(--border);
      border-left: 3px solid var(--teal);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      color: var(--white); font-size: 0.85rem; font-weight: 500;
      min-width: 260px; max-width: 380px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 0.7rem;
      animation: toastIn 0.3s ease;
      backdrop-filter: blur(20px);
    }
    @keyframes toastIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast.success { border-left-color: var(--green); }
    .toast.error { border-left-color: var(--coral); }
    .toast.warning { border-left-color: var(--gold); }
    .toast.success i { color: var(--green); }
    .toast.error i { color: var(--coral); }
    .toast.warning i { color: var(--gold); }

    @media (max-width: 700px) {
      body { padding: 1.5rem 1rem 3rem; }
      .card { padding: 1.2rem 1rem; }
      .modal { padding: 1.5rem 1.2rem; }
      .top-header { flex-direction: column; align-items: flex-start; }
      .form-row { grid-template-columns: 1fr; }
      .search-wrap { max-width: 100%; }
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="global-loader" id="globalLoader">
  <div class="spinner"></div>
  <p>Chargement…</p>
</div>

<div class="container">

  <!-- HEADER -->
  <div class="top-header">
    <div class="brand">
      <div class="logo-icon">MB</div>
      <div>
        <h1>M.N.A BATI</h1>
        <span>Admin · Réalisations</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="connection-badge" id="connectionBadge">
        <i class="fas fa-circle"></i>
        <span>Supabase</span>
      </div>
      <a href="realisations.html" target="_blank" class="btn btn-secondary btn-sm">
        <i class="fas fa-external-link-alt"></i> Voir la page
      </a>
      <button class="btn btn-primary btn-sm" onclick="RealAdmin.openModal()">
        <i class="fas fa-plus"></i> Nouveau projet
      </button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-images"></i></div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Total projets</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-eye"></i></div>
      <div class="stat-value" id="statPublished">0</div>
      <div class="stat-label">Publiés</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-eye-slash"></i></div>
      <div class="stat-value" id="statDraft">0</div>
      <div class="stat-label">Brouillons</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-calendar"></i></div>
      <div class="stat-value" id="statYear">0</div>
      <div class="stat-label">Cette année</div>
    </div>
  </div>

  <!-- FILTERS + SEARCH -->
  <div class="filters-bar">
    <button class="filter-btn active" data-filter="all">
      <i class="fas fa-th-large"></i> Tout
      <span class="count" id="countAll">0</span>
    </button>
    <button class="filter-btn" data-filter="villa">
      <i class="fas fa-home"></i> Villas
      <span class="count" id="countVilla">0</span>
    </button>
    <button class="filter-btn" data-filter="piscine">
      <i class="fas fa-swimmer"></i> Piscines
      <span class="count" id="countPiscine">0</span>
    </button>
    <button class="filter-btn" data-filter="extension">
      <i class="fas fa-expand-arrows-alt"></i> Extensions
      <span class="count" id="countExtension">0</span>
    </button>
    <button class="filter-btn" data-filter="maconnerie">
      <i class="fas fa-hard-hat"></i> Maçonnerie
      <span class="count" id="countMaconnerie">0</span>
    </button>
    <button class="filter-btn" data-filter="amenagement">
      <i class="fas fa-tree"></i> Aménagements
      <span class="count" id="countAmenagement">0</span>
    </button>

    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Rechercher (titre, ville…)">
    </div>
  </div>

  <!-- GRID -->
  <div class="card">
    <div class="card-header">
      <h2><i class="fas fa-images"></i> Toutes les réalisations</h2>
      <button class="btn btn-ghost btn-sm" onclick="RealAdmin.loadAll()">
        <i class="fas fa-sync-alt"></i> Recharger
      </button>
    </div>

    <div class="projects-grid" id="projectsGrid"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <div class="modal-header">
      <h2><i class="fas fa-images"></i> <span id="modalTitle">Nouveau projet</span></h2>
      <button class="modal-close" onclick="RealAdmin.closeModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form id="projectForm" onsubmit="RealAdmin.save(event)">
      <input type="hidden" id="originalId">

      <div class="form-field">
        <label>Titre du projet <span class="req">*</span></label>
        <input type="text" id="fTitle" required placeholder="ex: Villa Contemporaine avec Piscine">
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Catégorie <span class="req">*</span></label>
          <select id="fCategory" required>
            <option value="villa">Villa</option>
            <option value="piscine">Piscine</option>
            <option value="extension">Extension</option>
            <option value="maconnerie">Maçonnerie</option>
            <option value="amenagement">Aménagement</option>
          </select>
        </div>
        <div class="form-field">
          <label>Année</label>
          <input type="number" id="fYear" min="1990" max="2100" placeholder="2024">
        </div>
      </div>

      <div class="form-field">
        <label>Localisation</label>
        <input type="text" id="fLocation" placeholder="ex: Salaise-sur-Sanne (38)">
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Surface / Dimensions</label>
          <input type="text" id="fSurface" placeholder="ex: 220 m²">
        </div>
        <div class="form-field">
          <label>Durée du chantier</label>
          <input type="text" id="fDuree" placeholder="ex: 8 mois">
        </div>
      </div>

      <div class="form-field">
        <label>Image (URL)</label>
        <input type="text" id="fImage" placeholder="https://images.unsplash.com/...">
        <small>Collez l'adresse d'une image (jpg, png, webp)</small>
        <div class="img-preview" id="imgPreview"></div>
      </div>

      <div class="form-field">
        <label>Description (facultatif)</label>
        <textarea id="fDescription" placeholder="Décrivez le projet en quelques mots…"></textarea>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Ordre d'affichage</label>
          <input type="number" id="fOrder" value="0" min="0">
          <small>Plus petit = plus haut dans la liste</small>
        </div>
        <div class="form-field">
          <label>Statut</label>
          <select id="fStatus">
            <option value="published">✅ Publié</option>
            <option value="draft">📝 Brouillon</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="RealAdmin.closeModal()">
          Annuler
        </button>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <i class="fas fa-save"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const RealAdmin = (function () {
  'use strict';

  if (!window.MNA || typeof window.MNA.getClient !== 'function') {
    console.error('❌ config.js non chargé');
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('globalLoader').innerHTML = `
        <div style="text-align:center; color:#ff8b8f; padding:2rem;">
          <i class="fas fa-exclamation-triangle" style="font-size:2rem; margin-bottom:1rem; display:block;"></i>
          <p style="font-weight:600;">config.js non chargé</p>
        </div>
      `;
      document.getElementById('globalLoader').classList.add('active');
    });
    return {
      boot: () => {}, loadAll: () => {}, openModal: () => {}, closeModal: () => {},
      edit: () => {}, remove: () => {}, toggleStatus: () => {}, save: () => {},
      exportJSON: () => {}
    };
  }

  const supabase = window.MNA.getClient();
  const state = {
    items: [],
    filter: 'all',
    search: ''
  };

  const CAT_LABELS = {
    villa: 'Villa',
    piscine: 'Piscine',
    extension: 'Extension',
    maconnerie: 'Maçonnerie',
    amenagement: 'Aménagement'
  };

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function showLoader() { document.getElementById('globalLoader').classList.add('active'); }
  function hideLoader() { document.getElementById('globalLoader').classList.remove('active'); }
  function toast(message, type = 'success') {
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${esc(message)}</span>`;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => {
      el.style.transition = 'all 0.3s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateX(120%)';
      setTimeout(() => el.remove(), 300);
    }, 3500);
  }
  function updateConnection(ok) {
    const badge = document.getElementById('connectionBadge');
    if (!badge) return;
    if (ok) {
      badge.classList.remove('offline');
      badge.querySelector('span').textContent = 'Connecté';
    } else {
      badge.classList.add('offline');
      badge.querySelector('span').textContent = 'Hors ligne';
    }
  }

  async function loadAll() {
    showLoader();
    try {
      const { data, error } = await supabase
        .from('realisations')
        .select('*')
        .order('sort_order', { ascending: true })
        .order('created_at', { ascending: false });

      if (error) {
        if (error.message.includes('does not exist') || error.code === '42P01') {
          throw new Error('La table "realisations" n\'existe pas.');
        }
        if (error.code === '42501') {
          throw new Error('Permission refusée. Exécutez GRANT ON public.realisations TO anon;');
        }
        throw error;
      }

      state.items = data || [];
      renderStats();
      renderGrid();
      updateConnection(true);
    } catch (err) {
      console.error('loadAll:', err);
      toast(err.message, 'error');
      updateConnection(false);
      document.getElementById('projectsGrid').innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle" style="color:var(--coral);"></i>
          <p>Erreur de chargement</p>
          <small>${esc(err.message)}</small>
        </div>
      `;
    } finally {
      hideLoader();
    }
  }

  function renderStats() {
    const total = state.items.length;
    const published = state.items.filter(i => i.status === 'published').length;
    const draft = state.items.filter(i => i.status === 'draft').length;
    const currentYear = new Date().getFullYear();
    const thisYear = state.items.filter(i => i.year === currentYear).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPublished').textContent = published;
    document.getElementById('statDraft').textContent = draft;
    document.getElementById('statYear').textContent = thisYear;

    document.getElementById('countAll').textContent = total;
    document.getElementById('countVilla').textContent = state.items.filter(i => i.category === 'villa').length;
    document.getElementById('countPiscine').textContent = state.items.filter(i => i.category === 'piscine').length;
    document.getElementById('countExtension').textContent = state.items.filter(i => i.category === 'extension').length;
    document.getElementById('countMaconnerie').textContent = state.items.filter(i => i.category === 'maconnerie').length;
    document.getElementById('countAmenagement').textContent = state.items.filter(i => i.category === 'amenagement').length;
  }

  function getFiltered() {
    let list = state.items;
    if (state.filter !== 'all') {
      list = list.filter(i => i.category === state.filter);
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      list = list.filter(i => {
        const hay = [i.title, i.location, i.surface, i.duree, i.description].join(' ').toLowerCase();
        return hay.includes(q);
      });
    }
    return list;
  }

  function renderGrid() {
    const grid = document.getElementById('projectsGrid');
    const list = getFiltered();

    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-images"></i>
          <p>${state.search ? 'Aucun résultat' : 'Aucune réalisation'}</p>
          <small>${state.search ? 'Essayez un autre mot-clé' : 'Cliquez sur « Nouveau projet »'}</small>
        </div>
      `;
      return;
    }

    grid.innerHTML = list.map(p => {
      const img = p.image || 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=800&q=70&fm=webp';
      const catClass = p.category || 'villa';
      const catLabel = CAT_LABELS[catClass] || catClass;

      return `
        <div class="project-item">
          <div class="project-img" style="background-image: url('${esc(img)}');">
            <span class="project-cat ${catClass}">${catLabel}</span>
            ${p.year ? `<span class="project-year-badge">${p.year}</span>` : ''}
            <span class="project-status ${p.status === 'published' ? 'published' : 'draft'}">
              ${p.status === 'published' ? 'Publié' : 'Brouillon'}
            </span>
          </div>
          <div class="project-body">
            <h3>${esc(p.title)}</h3>
            ${p.location ? `<div class="project-loc"><i class="fas fa-map-marker-alt"></i> ${esc(p.location)}</div>` : ''}
            ${(p.surface || p.duree) ? `
              <div class="project-specs-mini">
                ${p.surface ? `<span><i class="fas fa-ruler-combined"></i> ${esc(p.surface)}</span>` : ''}
                ${p.duree ? `<span><i class="fas fa-clock"></i> ${esc(p.duree)}</span>` : ''}
              </div>
            ` : ''}
            <div class="project-actions">
              <button class="btn btn-ghost btn-sm" onclick="RealAdmin.toggleStatus('${esc(p.id)}')">
                <i class="fas fa-${p.status === 'published' ? 'eye-slash' : 'eye'}"></i>
                ${p.status === 'published' ? 'Masquer' : 'Publier'}
              </button>
              <button class="btn btn-ghost btn-sm" onclick="RealAdmin.edit('${esc(p.id)}')">
                <i class="fas fa-pen"></i> Modifier
              </button>
              <button class="btn btn-ghost btn-sm btn-danger" onclick="RealAdmin.remove('${esc(p.id)}')">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function openModal(item = null) {
    document.getElementById('modalTitle').textContent = item ? 'Modifier le projet' : 'Nouveau projet';
    document.getElementById('originalId').value = item ? item.id : '';

    if (item) {
      document.getElementById('fTitle').value = item.title || '';
      document.getElementById('fCategory').value = item.category || 'villa';
      document.getElementById('fYear').value = item.year || '';
      document.getElementById('fLocation').value = item.location || '';
      document.getElementById('fSurface').value = item.surface || '';
      document.getElementById('fDuree').value = item.duree || '';
      document.getElementById('fImage').value = item.image || '';
      document.getElementById('fDescription').value = item.description || '';
      document.getElementById('fOrder').value = item.sort_order || 0;
      document.getElementById('fStatus').value = item.status || 'published';
      updateImagePreview();
    } else {
      document.getElementById('projectForm').reset();
      document.getElementById('originalId').value = '';
      document.getElementById('fOrder').value = 0;
      document.getElementById('fStatus').value = 'published';
      document.getElementById('imgPreview').classList.remove('show');
    }

    document.getElementById('projectModal').classList.add('active');
    setTimeout(() => document.getElementById('fTitle').focus(), 100);
  }

  function closeModal() {
    document.getElementById('projectModal').classList.remove('active');
  }

  function edit(id) {
    const item = state.items.find(i => i.id === id);
    if (item) openModal(item);
  }

  function updateImagePreview() {
    const url = document.getElementById('fImage').value.trim();
    const preview = document.getElementById('imgPreview');
    if (url) {
      preview.style.backgroundImage = `url('${url}')`;
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
    }
  }

  async function save(e) {
    e.preventDefault();
    showLoader();

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      const originalId = document.getElementById('originalId').value;
      const title = document.getElementById('fTitle').value.trim();
      const category = document.getElementById('fCategory').value;

      if (!title || !category) throw new Error('Titre et catégorie sont obligatoires');

      const data = {
        title,
        category,
        year: parseInt(document.getElementById('fYear').value) || null,
        location: document.getElementById('fLocation').value.trim(),
        surface: document.getElementById('fSurface').value.trim(),
        duree: document.getElementById('fDuree').value.trim(),
        image: document.getElementById('fImage').value.trim(),
        description: document.getElementById('fDescription').value.trim(),
        sort_order: parseInt(document.getElementById('fOrder').value) || 0,
        status: document.getElementById('fStatus').value
      };

      if (originalId) {
        const { error } = await supabase
          .from('realisations')
          .update(data)
          .eq('id', originalId);
        if (error) throw error;
        toast('Projet modifié ✓', 'success');
      } else {
        const { error } = await supabase
          .from('realisations')
          .insert([data]);
        if (error) throw error;
        toast('Projet créé ✓', 'success');
      }

      closeModal();
      await loadAll();

    } catch (err) {
      console.error('save:', err);
      toast(err.message, 'error');
    } finally {
      hideLoader();
      btn.disabled = false;
    }
  }

  async function remove(id) {
    if (!confirm('Supprimer définitivement ce projet ?')) return;
    showLoader();
    try {
      const { error } = await supabase
        .from('realisations')
        .delete()
        .eq('id', id);
      if (error) throw error;
      toast('Projet supprimé', 'success');
      await loadAll();
    } catch (err) {
      console.error('remove:', err);
      toast(err.message, 'error');
    } finally {
      hideLoader();
    }
  }

  async function toggleStatus(id) {
    const item = state.items.find(i => i.id === id);
    if (!item) return;
    const newStatus = item.status === 'published' ? 'draft' : 'published';
    showLoader();
    try {
      const { error } = await supabase
        .from('realisations')
        .update({ status: newStatus })
        .eq('id', id);
      if (error) throw error;
      toast(newStatus === 'published' ? 'Projet publié ✓' : 'Projet masqué', 'success');
      await loadAll();
    } catch (err) {
      console.error('toggleStatus:', err);
      toast(err.message, 'error');
    } finally {
      hideLoader();
    }
  }

  function exportJSON() {
    const list = getFiltered();
    if (list.length === 0) { toast('Aucune donnée', 'warning'); return; }
    const data = JSON.stringify(list, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'realisations-' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast(`${list.length} projets exportés`, 'success');
  }

  function boot() {
    loadAll();

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.filter = btn.getAttribute('data-filter');
        renderGrid();
      });
    });

    const searchInput = document.getElementById('searchInput');
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.search = e.target.value.trim();
        renderGrid();
      }, 250);
    });

    document.getElementById('fImage').addEventListener('input', updateImagePreview);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    document.getElementById('projectModal').addEventListener('click', (e) => {
      if (e.target.id === 'projectModal') closeModal();
    });
  }

  return { boot, loadAll, openModal, closeModal, edit, remove, toggleStatus, save, exportJSON };
})();

// ✅ Ne boot qu'après validation de l'auth
function bootWhenReady() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', RealAdmin.boot);
  } else {
    RealAdmin.boot();
  }
}

if (window.__MNA_AUTH_OK__) {
  bootWhenReady();
} else {
  document.addEventListener('mna-auth-ok', bootWhenReady);
}
</script>

<!-- ⬇️ ADMIN MENU (Sidebar universel) -->
<script src="admin-menu.js"></script>

</body>
</html>
