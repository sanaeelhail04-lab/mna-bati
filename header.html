<!-- header.html -->
<style>
  /* ============================================================
     VARIABLES DE THÈME (héritées du <html data-theme>)
     ============================================================ */
  :root,
  [data-theme="dark"] {
    --hdr-bg: #ffffff;
    --hdr-bg-top: #0c3b5e;
    --hdr-text: #1e293b;
    --hdr-text-strong: #0c3b5e;
    --hdr-text-muted: #64748b;
    --hdr-border: #e2e8f0;
    --hdr-hover-bg: #f8fafc;
    --hdr-teal: #0096ab;
    --hdr-teal-dark: #007d8f;
    --hdr-teal-soft: #e0f2fe;
    --hdr-teal-soft-2: #f0f9ff;
    --hdr-star: #fbbc04;
    --hdr-shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
  }

  [data-theme="light"] {
    --hdr-bg: #ffffff;
    --hdr-bg-top: #082c47;
    --hdr-text: #1e293b;
    --hdr-text-strong: #082c47;
    --hdr-text-muted: #64748b;
    --hdr-border: #e2e8f0;
    --hdr-hover-bg: #f8fafc;
    --hdr-teal: #0096ab;
    --hdr-teal-dark: #007d8f;
    --hdr-teal-soft: #e0f2fe;
    --hdr-teal-soft-2: #f0f9ff;
    --hdr-star: #fbbc04;
    --hdr-shadow: 0 2px 10px rgba(8, 44, 71, 0.06);
  }

  /* Base Reset & Fonts */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

  .site-header {
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: var(--hdr-shadow);
  }

  /* ============================================================
     1. TOP UTILITY BAR
     ============================================================ */
  .top-bar {
    background-color: var(--hdr-bg-top);
    color: #ffffff;
    font-size: 13.5px;
    padding: 8px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    transition: background 0.4s ease;
  }

  .top-bar-left,
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .top-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }

  .top-item i.fa-circle-check {
    color: #25d366;
  }

  .top-bar-right a {
    color: #ffffff;
    text-decoration: none;
  }

  .top-bar-right a:hover {
    text-decoration: underline;
  }

  /* ============================================================
     2. MAIN NAVIGATION BAR
     ============================================================ */
  .main-nav {
    background-color: var(--hdr-bg);
    padding: 12px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    transition: background 0.4s ease;
  }

  /* Logo Branding */
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    background-color: var(--hdr-teal);
    color: #ffffff;
    font-weight: 800;
    font-size: 20px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 150, 171, 0.3);
  }

  .brand-text h1 {
    font-size: 20px;
    font-weight: 800;
    color: var(--hdr-text-strong);
    line-height: 1.1;
  }

  .brand-text span {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--hdr-text-muted);
    letter-spacing: 0.5px;
  }

  /* Navigation Links */
  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links > li > a {
    text-decoration: none;
    color: var(--hdr-text);
    font-weight: 600;
    font-size: 15px;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .nav-links > li > a:hover {
    color: var(--hdr-teal);
  }

  /* Services Dropdown */
  .dropdown {
    position: relative;
  }

  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--hdr-bg);
    min-width: 260px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    padding: 10px 0;
    display: none;
    list-style: none;
    border-top: 3px solid var(--hdr-teal);
    z-index: 100;
  }

  .dropdown:hover .dropdown-menu {
    display: block;
  }

  .dropdown-menu li a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 14px;
    color: var(--hdr-text);
    font-weight: 500;
    text-decoration: none;
  }

  .dropdown-menu li a i {
    color: var(--hdr-teal);
    font-size: 13px;
    width: 16px;
    text-align: center;
  }

  .dropdown-menu li a:hover {
    background-color: var(--hdr-hover-bg);
    color: var(--hdr-teal);
  }

  /* Loading state du dropdown */
  .dropdown-menu .loading-item {
    padding: 12px 20px;
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dropdown-menu .loading-item i {
    color: var(--hdr-teal);
    animation: headerSpin 1s linear infinite;
  }

  @keyframes headerSpin {
    to { transform: rotate(360deg); }
  }

  /* Right Actions */
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  /* ============================================================
     RATING BADGE — Google Reviews
     ============================================================ */
  .rating-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 10px;
    background: linear-gradient(135deg, var(--hdr-bg), var(--hdr-hover-bg));
    border: 1px solid var(--hdr-border);
    border-radius: 24px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    color: var(--hdr-text-strong);
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .rating-badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,150,171,0.06), transparent);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }

  .rating-badge:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,150,171,0.22);
    border-color: var(--hdr-teal);
  }

  .rating-badge:hover::before {
    opacity: 1;
  }

  .rating-badge .google-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .rating-badge .stars {
    display: flex;
    align-items: center;
    gap: 1px;
    position: relative;
    z-index: 1;
  }

  .rating-badge .stars i {
    color: var(--hdr-star);
    font-size: 13px;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(251,188,4,0.35);
  }

  .rating-badge .rating-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
    position: relative;
    z-index: 1;
  }

  .rating-badge .rating-score {
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
    font-weight: 800;
    color: var(--hdr-text-strong);
  }

  .rating-badge .rating-count {
    font-size: 10px;
    font-weight: 600;
    color: var(--hdr-text-muted);
    margin-top: -1px;
  }

  @media (max-width: 1200px) {
    .rating-badge .rating-count { display: none; }
    .rating-badge { padding: 6px 12px 6px 8px; }
  }

  @media (max-width: 1024px) {
    .rating-badge { display: none; }
  }

  /* Phone Button */
  .phone-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--hdr-text-strong);
    font-weight: 700;
    font-size: 16px;
  }

  .phone-icon {
    width: 38px;
    height: 38px;
    background-color: var(--hdr-teal-soft);
    color: var(--hdr-teal);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CTA Button */
  .cta-btn {
    background-color: var(--hdr-teal);
    color: #ffffff;
    text-decoration: none;
    padding: 10px 28px;
    border-radius: 25px;
    font-weight: 700;
    font-size: 15px;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 12px rgba(0, 150, 171, 0.25);
    white-space: nowrap;
  }

  .cta-btn:hover {
    background-color: var(--hdr-teal-dark);
    transform: translateY(-1px);
  }

  /* Login Button */
  .login-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--hdr-text-strong);
    font-weight: 600;
    font-size: 14px;
    padding: 8px 18px;
    border: 1.5px solid var(--hdr-border);
    border-radius: 20px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .login-btn i {
    color: var(--hdr-teal);
    font-size: 14px;
  }

  .login-btn:hover {
    background-color: var(--hdr-teal-soft-2);
    border-color: var(--hdr-teal);
    color: var(--hdr-teal);
  }

  /* ============================================================
     3. HAMBURGER MENU (Mobile)
     ============================================================ */
  .menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 26px;
    color: var(--hdr-text-strong);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .menu-toggle:hover {
    background-color: var(--hdr-teal-soft-2);
  }

  /* ============================================================
     4. BOUTON FERMETURE (X) DU DRAWER
     ============================================================ */
  .menu-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 44px;
    height: 44px;
    background: var(--hdr-teal);
    color: #ffffff;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    box-shadow: 0 4px 12px rgba(0, 150, 171, 0.35);
    transition: background 0.2s, transform 0.2s;
  }

  .menu-close:hover {
    background: var(--hdr-teal-dark);
    transform: rotate(90deg);
  }

  .menu-close.visible {
    display: flex;
  }

  /* Overlay when menu is open */
  .menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 998;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .menu-overlay.active {
    display: block;
    opacity: 1;
  }

  /* ============================================================
     5. RESPONSIVE — TABLETTES
     ============================================================ */
  @media (max-width: 1200px) {
    .nav-links { gap: 20px; }
    .nav-links > li > a { font-size: 14px; }
  }

  @media (max-width: 1024px) {
    .top-bar {
      padding: 8px 20px;
      font-size: 12.5px;
    }
    .top-bar-right { display: none; }
    .main-nav { padding: 12px 20px; }
    .phone-btn span { display: none; }
    .login-btn span { display: none; }
    .login-btn { padding: 8px 12px; }
  }

  /* ============================================================
     6. RESPONSIVE — MOBILES
     ============================================================ */
  @media (max-width: 900px) {
    .menu-toggle {
      display: block;
      order: 3;
    }

    .main-nav {
      flex-wrap: wrap;
      padding: 12px 16px;
      gap: 10px;
    }

    .nav-links,
    .nav-actions {
      position: fixed;
      top: 0;
      right: -100%;
      width: 300px;
      max-width: 85vw;
      height: 100vh;
      background: var(--hdr-bg);
      flex-direction: column;
      align-items: flex-start;
      padding: 80px 25px 30px;
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.15);
      transition: right 0.35s ease;
      z-index: 999;
      overflow-y: auto;
      gap: 0;
    }

    .nav-links.active,
    .nav-actions.active {
      right: 0;
    }

    .nav-links { top: 0; }

    .nav-links > li {
      width: 100%;
      border-bottom: 1px solid var(--hdr-border);
    }

    .nav-links > li > a {
      padding: 16px 0;
      font-size: 16px;
      width: 100%;
      justify-content: space-between;
      color: var(--hdr-text);
    }

    .dropdown-menu {
      position: static;
      display: none;
      box-shadow: none;
      border-top: none;
      border-left: 3px solid var(--hdr-teal);
      margin: 0 0 10px 10px;
      padding: 5px 0;
      min-width: 100%;
      border-radius: 0;
      background: transparent;
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }

    .nav-actions {
      position: fixed;
      top: auto;
      bottom: 0;
      height: auto;
      padding: 20px 25px 30px;
      border-top: 1px solid var(--hdr-border);
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      box-shadow: none;
      background: var(--hdr-bg);
    }

    .nav-actions.active { right: 0; }

    .nav-actions .cta-btn,
    .nav-actions .login-btn,
    .nav-actions .phone-btn {
      width: 100%;
      justify-content: center;
      padding: 14px 20px;
      font-size: 15px;
    }

    .nav-actions .phone-btn span,
    .nav-actions .login-btn span {
      display: inline;
    }

    .nav-actions .phone-btn {
      border: 1.5px solid var(--hdr-border);
      border-radius: 25px;
      padding: 14px 20px;
    }

    .rating-badge {
      display: flex;
      width: 100%;
      justify-content: center;
    }
  }

  /* ============================================================
     7. PETITS MOBILES
     ============================================================ */
  @media (max-width: 480px) {
    .top-bar {
      font-size: 11.5px;
      padding: 6px 12px;
      justify-content: center;
    }

    .top-bar-left {
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .top-item { font-size: 11px; }

    .main-nav { padding: 10px 12px; }

    .brand-text h1 { font-size: 16px; }
    .brand-text span { font-size: 8px; }

    .logo-icon {
      width: 40px;
      height: 40px;
      font-size: 17px;
    }

    .nav-links,
    .nav-actions {
      width: 100%;
      max-width: 100vw;
    }

    .cta-btn {
      padding: 10px 20px;
      font-size: 14px;
    }
  }
</style>

<script>
/* ============================================================
   M.N.A BATI — Header dynamique
   ============================================================ */
(function () {
  'use strict';

  /* ============================================================
     1. SERVICES DYNAMIQUES
     ============================================================ */
  const ICONS = {
    maconnerie: 'fa-solid fa-hard-hat',
    villa: 'fa-solid fa-home',
    piscine: 'fa-solid fa-swimmer',
    extension: 'fa-solid fa-expand-arrows-alt',
    amenagement: 'fa-solid fa-tree'
  };

  function renderServices(services) {
    const dropdown = document.getElementById('servicesDropdown');
    if (!dropdown) return;

    if (!services || services.length === 0) {
      dropdown.innerHTML = `
        <li class="loading-item" style="animation:none; color:#94a3b8;">
          <i class="fa-solid fa-inbox" style="animation:none;"></i>
          Aucun service
        </li>
      `;
      return;
    }

    dropdown.innerHTML = services.map(s => {
      const icon = ICONS[s.slug] || 'fa-solid fa-tools';
      return `
        <li>
          <a href="service.html?slug=${s.slug}">
            <i class="${icon}"></i> ${s.title}
          </a>
        </li>
      `;
    }).join('');
  }

  function renderError() {
    const dropdown = document.getElementById('servicesDropdown');
    if (!dropdown) return;
    dropdown.innerHTML = `
      <li class="loading-item" style="animation:none; color:#eb4046;">
        <i class="fa-solid fa-exclamation-triangle" style="animation:none; color:#eb4046;"></i>
        Erreur de chargement
      </li>
      <li>
        <a href="services.html" style="color:#0096ab;">
          <i class="fa-solid fa-arrow-right"></i> Voir tous les services
        </a>
      </li>
    `;
  }

  function waitForMNA(callback, attempts = 0) {
    if (window.MNA && typeof window.MNA.getClient === 'function') {
      callback(window.MNA.getClient());
      return;
    }
    if (attempts > 50) {
      console.warn('⚠️ Header: window.MNA non disponible après attente');
      renderError();
      return;
    }
    setTimeout(() => waitForMNA(callback, attempts + 1), 100);
  }

  async function loadServicesFromDB() {
    waitForMNA(async (supabase) => {
      if (!supabase) {
        console.warn('⚠️ Header: Supabase non disponible');
        renderError();
        return;
      }

      try {
        const { data, error } = await supabase
          .from('services')
          .select('slug, title, sort_order, status')
          .eq('status', 'published')
          .order('sort_order', { ascending: true })
          .order('created_at', { ascending: true });

        if (error) throw error;

        renderServices(data || []);
      } catch (err) {
        console.error('Header: erreur chargement services', err);
        renderError();
      }
    });
  }

  /* ============================================================
     2. MENU MOBILE
     ============================================================ */
  function initMobileMenu() {
    const toggle     = document.getElementById('menuToggle');
    const closeBtn   = document.getElementById('menuClose');
    const navLinks   = document.getElementById('navLinks');
    const navActions = document.getElementById('navActions');
    const overlay    = document.getElementById('menuOverlay');
    const servicesLi = document.getElementById('servicesDropdownLi');

    if (!toggle) return;

    function closeMenu() {
      navLinks.classList.remove('active');
      navActions.classList.remove('active');
      overlay.classList.remove('active');
      if (closeBtn) closeBtn.classList.remove('visible');
      document.body.style.overflow = '';
      toggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
    }

    function openMenu() {
      navLinks.classList.add('active');
      navActions.classList.add('active');
      overlay.classList.add('active');
      if (closeBtn) closeBtn.classList.add('visible');
      document.body.style.overflow = 'hidden';
      toggle.innerHTML = '<i class="fa-solid fa-xmark"></i>';
    }

    toggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.contains('active');
      isOpen ? closeMenu() : openMenu();
    });

    if (closeBtn) {
      closeBtn.addEventListener('click', closeMenu);
    }

    overlay.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMenu();
    });

    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', (e) => {
        const isServicesToggle = link.closest('.dropdown') &&
                                 link.nextElementSibling &&
                                 link.nextElementSibling.classList.contains('dropdown-menu') &&
                                 window.innerWidth <= 900;
        if (isServicesToggle) {
          e.preventDefault();
          servicesLi.classList.toggle('open');
        } else {
          closeMenu();
        }
      });
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) {
        closeMenu();
        servicesLi.classList.remove('open');
      }
    });
  }

  /* ============================================================
     INIT
     ============================================================ */
  function init() {
    loadServicesFromDB();
    initMobileMenu();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
