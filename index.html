<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="M.N.A BATI - Concevez votre projet de construction en 3 clics.">
  <title>M.N.A BATI · Concevez Votre Projet en 3 Clics</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Supabase SDK + Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --navy: #0d3b5c;
      --navy-dark: #082c47;
      --navy-deep: #051c2e;
      --navy-black: #02111d;
      --teal: #0096ab;
      --teal-light: #00b4cc;
      --gold: #f4b942;
      --white: #ffffff;
      --text-light: #cbd5e1;
      --text-muted: #94a3b8;
      --font: 'Poppins', system-ui, sans-serif;
      --transition: 0.3s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--navy-deep);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
      z-index: 1;
    }

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--navy-deep); }
    ::-webkit-scrollbar-thumb { background: var(--teal); border-radius: 4px; }

    .mna-alert {
      display: none;
      background: #fde68a;
      color: #78350f;
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
      text-align: center;
      border-bottom: 2px solid #f59e0b;
    }
    .mna-alert.show { display: block; }
    .mna-alert code {
      background: rgba(146,64,14,0.1);
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
    }

    #header-placeholder {
      position: relative;
      z-index: 99999;
      isolation: isolate;
    }
    #header-placeholder.loaded { min-height: 0; }

    /* LOADER */
    .page-loader {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.2rem;
      color: var(--text-muted);
    }
    .page-loader .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(0,150,171,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Cache le contenu tant que non chargé */
    .index-content { display: none; }
    .index-content.ready { display: block; }

    /* HERO */
    .hero {
      position: relative;
      padding: 4rem 1.5rem 5rem;
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 3rem;
      align-items: center;
      min-height: 90vh;
    }
    .hero-left { display: flex; flex-direction: column; gap: 1.4rem; }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: rgba(0,150,171,0.12);
      border: 1px solid rgba(0,150,171,0.4);
      border-radius: 9999px;
      padding: 0.4rem 1.1rem;
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--teal-light);
      width: fit-content;
    }
    .hero-badge .pulse-dot {
      width: 7px; height: 7px;
      background: var(--teal-light);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .hero-title {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .hero-title .accent {
      background: linear-gradient(135deg, var(--teal-light), #4dd0e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1rem; color: var(--text-light);
      max-width: 520px; line-height: 1.75;
    }

    .quick-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.7rem; margin-top: 0.5rem;
    }
    .selector-tab {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.9rem 1.1rem;
      background: rgba(13,59,92,0.35);
      border: 1.5px solid rgba(0,150,171,0.2);
      border-radius: 14px;
      cursor: pointer; transition: var(--transition);
      text-align: left; font-weight: 600;
      font-size: 0.82rem; color: var(--text-light);
    }
    .selector-tab i { font-size: 1.15rem; color: var(--teal-light); flex-shrink: 0; transition: var(--transition); }
    .selector-tab:hover { border-color: rgba(0,150,171,0.5); background: rgba(13,59,92,0.5); transform: translateY(-2px); }
    .selector-tab.active {
      background: linear-gradient(135deg, rgba(0,150,171,0.25), rgba(0,150,171,0.1));
      border-color: var(--teal); color: var(--white);
      box-shadow: 0 8px 20px rgba(0,150,171,0.25);
    }
    .selector-tab.active i { color: var(--white); transform: scale(1.1); }

    .hero-cta { margin-top: 0.8rem; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: linear-gradient(135deg, var(--teal), #006e82);
      color: var(--white); font-weight: 700; font-size: 0.95rem;
      padding: 1.05rem 2rem; border-radius: 9999px;
      transition: var(--transition);
      box-shadow: 0 10px 25px rgba(0,150,171,0.4);
      white-space: nowrap; cursor: pointer;
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(0,150,171,0.55);
      background: linear-gradient(135deg, var(--teal-light), var(--teal));
    }
    .btn-primary i { transition: transform 0.2s ease; }
    .btn-primary:hover i { transform: translateX(5px); }

    .hero-right {
      position: relative; z-index: 1;
      aspect-ratio: 4/3.2;
      border-radius: 22px; overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      border: 1px solid rgba(0,150,171,0.25);
    }
    .showcase-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: scale(1.05);
    }
    .showcase-slide.active { opacity: 1; transform: scale(1); }
    .showcase-slide::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(2,17,29,0.1) 0%, rgba(2,17,29,0.85) 100%);
    }

    .showcase-info {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 1.8rem; z-index: 2;
      display: flex; flex-direction: column; gap: 0.7rem;
    }
    .showcase-tag {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(0,150,171,0.9); color: var(--white);
      padding: 0.3rem 0.9rem; border-radius: 9999px;
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      width: fit-content;
    }
    .showcase-title {
      font-size: 1.4rem; font-weight: 800;
      line-height: 1.15; letter-spacing: -0.02em;
    }
    .showcase-specs { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    .showcase-spec {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.78rem; color: var(--text-light); font-weight: 500;
    }
    .showcase-spec i { color: var(--teal-light); font-size: 0.75rem; }

    .showcase-dots {
      position: absolute; top: 1rem; right: 1rem;
      display: flex; gap: 0.4rem; z-index: 3;
    }
    .showcase-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: var(--transition); cursor: pointer;
    }
    .showcase-dot.active { background: var(--teal-light); width: 24px; border-radius: 4px; }

    .section {
      padding: 5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative; z-index: 1;
    }
    .section-header {
      text-align: center; max-width: 700px;
      margin: 0 auto 3.5rem;
    }
    .section-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(0,150,171,0.1);
      border: 1px solid rgba(0,150,171,0.35);
      color: var(--teal-light);
      padding: 0.3rem 1rem; border-radius: 9999px;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 1.8px; text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: clamp(1.7rem, 3.5vw, 2.5rem);
      font-weight: 800; letter-spacing: -0.02em;
      margin-bottom: 0.8rem; line-height: 1.15;
    }
    .section-title .accent { color: var(--teal-light); }
    .section-subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .slider-section {
      background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-black) 100%);
      max-width: none; padding: 5rem 1.5rem;
    }
    .slider-widget {
      max-width: 900px; margin: 0 auto;
      background: rgba(13,59,92,0.4);
      border: 1px solid rgba(0,150,171,0.25);
      border-radius: 22px; padding: 2.5rem 2.5rem;
      display: flex; flex-direction: column; gap: 2rem;
    }
    .slider-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    .slider-label {
      font-size: 0.78rem; font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .slider-value-display { display: flex; align-items: baseline; gap: 0.3rem; }
    .slider-value {
      font-size: 2.8rem; font-weight: 800;
      background: linear-gradient(135deg, var(--teal-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1; letter-spacing: -0.03em;
    }
    .slider-unit { font-size: 1rem; font-weight: 600; color: var(--teal-light); }

    .slider-input {
      position: relative; width: 100%; height: 40px;
      display: flex; align-items: center;
    }
    .slider-input input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--teal) 0%, var(--teal) var(--slider-percent, 50%), rgba(0,150,171,0.2) var(--slider-percent, 50%), rgba(0,150,171,0.2) 100%);
      border-radius: 3px; outline: none; cursor: pointer;
    }
    .slider-input input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px; height: 26px;
      border-radius: 50%; background: var(--white);
      border: 4px solid var(--teal);
      cursor: grab;
      box-shadow: 0 4px 12px rgba(0,150,171,0.5);
      transition: var(--transition);
    }
    .slider-input input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    .slider-input input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px;
      border-radius: 50%; background: var(--white);
      border: 4px solid var(--teal); cursor: grab;
    }

    .slider-results {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(0,150,171,0.15);
    }
    .slider-result {
      display: flex; flex-direction: column; gap: 0.3rem;
      padding: 1rem;
      background: rgba(0,150,171,0.08);
      border: 1px solid rgba(0,150,171,0.15);
      border-radius: 14px;
    }
    .slider-result-label {
      font-size: 0.68rem; font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.2px; text-transform: uppercase;
    }
    .slider-result-value { font-size: 1.15rem; font-weight: 800; color: var(--teal-light); }
    .slider-result-value span {
      font-size: 0.78rem; color: var(--text-muted);
      font-weight: 500; margin-left: 0.2rem;
    }
    .slider-cta { text-align: center; margin-top: 0.5rem; }

    .services-section {
      background: linear-gradient(180deg, var(--navy-black) 0%, var(--navy-deep) 100%);
      max-width: none; padding: 5rem 1.5rem;
    }
    .services-grid {
      max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.3rem;
    }
    .service-card {
      position: relative;
      background: rgba(13,59,92,0.35);
      border: 1px solid rgba(0,150,171,0.2);
      border-radius: 18px;
      padding: 1.9rem 1.5rem;
      cursor: pointer; transition: var(--transition);
      display: flex; flex-direction: column;
      min-height: 250px; overflow: hidden;
    }
    .service-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }
    .service-card:hover::before { transform: translateX(100%); }
    .service-card:hover {
      border-color: rgba(0,150,171,0.6);
      background: rgba(13,59,92,0.5);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(0,150,171,0.2);
    }
    .service-card .card-number {
      font-size: 0.72rem; font-weight: 700;
      color: var(--teal-light);
      letter-spacing: 2px; margin-bottom: 0.7rem;
    }
    .service-card .card-icon {
      width: 54px; height: 54px;
      border-radius: 14px;
      background: rgba(0,150,171,0.15);
      border: 1px solid rgba(0,150,171,0.35);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal-light); font-size: 1.4rem;
      margin-bottom: 1.1rem; transition: var(--transition);
    }
    .service-card:hover .card-icon {
      background: rgba(0,150,171,0.3);
      transform: rotate(-8deg) scale(1.05);
    }
    .service-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }
    .service-card p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.6; flex-grow: 1; }
    .service-card .card-link {
      margin-top: 1rem;
      color: var(--teal-light);
      font-size: 0.8rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 0.4rem;
      transition: gap 0.25s ease;
    }
    .service-card:hover .card-link { gap: 0.8rem; }

    .trust-section {
      background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-black) 100%);
      max-width: none; padding: 5rem 1.5rem;
    }
    .trust-grid {
      max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.3rem;
    }
    .trust-badge {
      background: linear-gradient(160deg, rgba(13,59,92,0.7), rgba(5,28,46,0.9));
      border: 1px solid rgba(0,150,171,0.2);
      border-radius: 18px;
      padding: 2rem 1.5rem;
      text-align: center;
      transition: var(--transition);
    }
    .trust-badge:hover {
      transform: translateY(-5px);
      border-color: rgba(0,150,171,0.5);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .trust-badge .trust-icon {
      width: 50px; height: 50px;
      border-radius: 14px;
      background: rgba(0,150,171,0.15);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal-light); font-size: 1.3rem;
      margin: 0 auto 1rem;
    }
    .trust-badge .trust-value {
      font-size: 2.4rem; font-weight: 800;
      background: linear-gradient(135deg, var(--teal-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem; line-height: 1;
    }
    .trust-badge .trust-label {
      font-size: 0.85rem; color: var(--text-light); line-height: 1.4;
    }

    #footer-placeholder {
      position: relative; z-index: 1;
      min-height: 200px; background: var(--navy-black);
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; gap: 2.5rem; padding: 2.5rem 1.2rem 3rem; min-height: auto; }
      .hero-right { max-width: 600px; margin: 0 auto; width: 100%; }
      .slider-widget { padding: 2rem 1.5rem; }
      .slider-results { grid-template-columns: 1fr 1fr; }
      .slider-results .slider-result:last-child { grid-column: span 2; }
      .section { padding: 4rem 1.2rem; }
    }
    @media (max-width: 600px) {
      .hero { padding: 1.8rem 1rem 2.5rem; }
      .hero-title { font-size: 1.85rem; }
      .quick-selector { grid-template-columns: 1fr; }
      .selector-tab { padding: 0.85rem 1rem; font-size: 0.8rem; }
      .btn-primary { width: 100%; justify-content: center; padding: 1rem 1.5rem; font-size: 0.88rem; }
      .showcase-title { font-size: 1.15rem; }
      .slider-widget { padding: 1.5rem 1.2rem; }
      .slider-value { font-size: 2.2rem; }
      .slider-results { grid-template-columns: 1fr; }
      .slider-results .slider-result:last-child { grid-column: auto; }
      .services-grid { grid-template-columns: 1fr; }
      .service-card { min-height: 220px; }
      .trust-badge { padding: 1.8rem 1.3rem; }
      .trust-badge .trust-value { font-size: 2rem; }
      .section { padding: 3rem 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="mna-alert" id="mnaAlert">
    ⚠️ <strong>Header/Footer non chargés.</strong> Ouvrez avec un serveur local :
    <code>Live Server</code>, <code>python -m http.server</code> ou <code>npx serve</code>.
  </div>

  <div id="header-placeholder"></div>

  <!-- LOADER -->
  <div class="page-loader" id="pageLoader">
    <div class="spinner"></div>
    <p>Chargement…</p>
  </div>

  <!-- CONTENU DYNAMIQUE -->
  <div class="index-content" id="indexContent">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-left">
        <div class="hero-badge">
          <span class="pulse-dot"></span>
          <span id="heroBadge">—</span>
        </div>
        <h1 class="hero-title" id="heroTitle">—</h1>
        <p class="hero-subtitle" id="heroSubtitle">—</p>
        <div class="quick-selector" id="quickSelector"></div>
        <div class="hero-cta">
          <a href="#" class="btn-primary" id="heroCta">
            <span id="heroCtaText">—</span>
            <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      </div>

      <div class="hero-right">
        <div class="showcase-dots" id="showcaseDots"></div>
        <div id="showcaseSlides"></div>
        <div class="showcase-info">
          <span class="showcase-tag" id="showcaseTag">—</span>
          <h3 class="showcase-title" id="showcaseTitle">—</h3>
          <div class="showcase-specs" id="showcaseSpecs"></div>
        </div>
      </div>
    </section>

    <!-- SLIDER -->
    <section class="slider-section">
      <div class="section-header">
        <div class="section-badge" id="sliderBadge">—</div>
        <h2 class="section-title" id="sliderTitle">—</h2>
        <p class="section-subtitle" id="sliderSubtitle">—</p>
      </div>
      <div class="slider-widget">
        <div class="slider-header">
          <span class="slider-label">Surface estimée</span>
          <div class="slider-value-display">
            <span class="slider-value" id="surfaceValue">120</span>
            <span class="slider-unit">m²</span>
          </div>
        </div>
        <div class="slider-input">
          <input type="range" id="surfaceRange" min="20" max="500" step="10" value="120">
        </div>
        <div class="slider-results">
          <div class="slider-result">
            <span class="slider-result-label">Durée estimée</span>
            <span class="slider-result-value" id="durationValue">4<span>mois</span></span>
          </div>
          <div class="slider-result">
            <span class="slider-result-label">Devis garanti</span>
            <span class="slider-result-value">48<span>h</span></span>
          </div>
          <div class="slider-result">
            <span class="slider-result-label">Garantie</span>
            <span class="slider-result-value">10<span>Ans</span></span>
          </div>
        </div>
        <div class="slider-cta">
          <a href="#" class="btn-primary" id="sliderCta">
            <span id="sliderCtaText">—</span>
            <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </section>

    <!-- SERVICES -->
    <section class="services-section">
      <div class="section-header">
        <div class="section-badge" id="servicesBadge">—</div>
        <h2 class="section-title" id="servicesTitle">—</h2>
        <p class="section-subtitle" id="servicesSubtitle">—</p>
      </div>
      <div class="services-grid" id="servicesGrid"></div>
    </section>

    <!-- TRUST -->
    <section class="trust-section">
      <div class="trust-grid" id="trustGrid"></div>
    </section>

  </div>

  <div id="footer-placeholder"></div>

  <script>
    (function () {
      'use strict';

      /* ============================================================
         1. CHARGEMENT HEADER / FOOTER
         ============================================================ */
      const isFileProtocol = window.location.protocol === 'file:';

      function loadComponent(id, path) {
        const placeholder = document.getElementById(id);
        if (!placeholder) return;

        if (isFileProtocol) {
          document.getElementById('mnaAlert').classList.add('show');
          return;
        }

        fetch(path)
          .then(r => r.ok ? r.text() : Promise.reject('HTTP ' + r.status))
          .then(html => {
            placeholder.innerHTML = html;
            placeholder.classList.add('loaded');
            placeholder.querySelectorAll('script').forEach(oldScript => {
              const s = document.createElement('script');
              Array.from(oldScript.attributes).forEach(a => s.setAttribute(a.name, a.value));
              s.appendChild(document.createTextNode(oldScript.innerHTML));
              oldScript.parentNode.replaceChild(s, oldScript);
            });
          })
          .catch(err => {
            console.error('Erreur ' + path, err);
            document.getElementById('mnaAlert').classList.add('show');
          });
      }

      loadComponent('header-placeholder', 'header.html');
      loadComponent('footer-placeholder', 'footer.html');

      /* ============================================================
         2. CHARGEMENT DEPUIS SUPABASE
         ============================================================ */
      const supabase = window.MNA.getClient();

      async function loadIndexData() {
        if (!supabase) {
          console.warn('⚠️ Supabase non disponible — utilisation des données par défaut');
          return null;
        }

        try {
          const { data, error } = await supabase
            .from('index_sections')
            .select('*');

          if (error) throw error;

          // Transformer le tableau en objet { section_key: content }
          const sections = {};
          (data || []).forEach(s => {
            sections[s.section_key] = s.content;
          });

          console.log('✅ Données index chargées depuis Supabase:', sections);
          return sections;
        } catch (err) {
          console.error('❌ Erreur chargement index:', err);
          return null;
        }
      }

      /* ============================================================
         3. RENDU : HERO
         ============================================================ */
      function renderHero(hero) {
        if (!hero) return;
        document.getElementById('heroBadge').textContent = hero.badge || '';
        document.getElementById('heroTitle').innerHTML = hero.title || '';
        document.getElementById('heroSubtitle').textContent = hero.subtitle || '';
        document.getElementById('heroCtaText').textContent = hero.cta_text || 'Devis gratuit';
        document.getElementById('heroCta').setAttribute('href', hero.cta_link || 'devis.html');
      }

      /* ============================================================
         4. RENDU : SELECTOR + SHOWCASE
         ============================================================ */
      const showcaseState = {
        currentKey: null,
        projectKeys: [],
        timer: null
      };

      function renderSelector(selector) {
        if (!selector) return;

        const tabs = selector.tabs || [];
        const projects = selector.projects || {};
        const container = document.getElementById('quickSelector');

        // Rendu des tabs
        container.innerHTML = tabs.map((t, i) => `
          <button class="selector-tab${i === 0 ? ' active' : ''}" data-project="${t.key}">
            <i class="fas ${t.icon}"></i>
            <span>${t.label}</span>
          </button>
        `).join('');

        // Rendu des slides
        const slidesContainer = document.getElementById('showcaseSlides');
        slidesContainer.innerHTML = tabs.map((t, i) => {
          const p = projects[t.key];
          if (!p) return '';
          return `<div class="showcase-slide${i === 0 ? ' active' : ''}" data-slide="${t.key}" style="background-image: url('${p.image}');"></div>`;
        }).join('');

        // Rendu des dots
        const dotsContainer = document.getElementById('showcaseDots');
        dotsContainer.innerHTML = tabs.map((t, i) => `
          <span class="showcase-dot${i === 0 ? ' active' : ''}" data-dot="${i}"></span>
        `).join('');

        // Stockage
        showcaseState.projectKeys = tabs.map(t => t.key);
        showcaseState.currentKey = tabs[0]?.key;

        // Affichage initial
        updateShowcase(showcaseState.currentKey, projects);

        // Listeners tabs
        document.querySelectorAll('.selector-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            updateShowcase(tab.getAttribute('data-project'), projects);
            resetAutoRotate(projects);
          });
        });

        // Listeners dots
        document.querySelectorAll('.showcase-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            const idx = parseInt(dot.getAttribute('data-dot'));
            updateShowcase(showcaseState.projectKeys[idx], projects);
            resetAutoRotate(projects);
          });
        });

        // Auto-rotate
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          startAutoRotate(projects);
        }
      }

      function updateShowcase(key, projects) {
        if (!key || !projects) return;
        const data = projects[key];
        if (!data) return;

        // Slides
        document.querySelectorAll('.showcase-slide').forEach(s => {
          s.classList.toggle('active', s.getAttribute('data-slide') === key);
        });

        // Tabs
        document.querySelectorAll('.selector-tab').forEach(t => {
          t.classList.toggle('active', t.getAttribute('data-project') === key);
        });

        // Dots
        const idx = showcaseState.projectKeys.indexOf(key);
        document.querySelectorAll('.showcase-dot').forEach((d, i) => {
          d.classList.toggle('active', i === idx);
        });

        showcaseState.currentKey = key;

        // Info
        document.getElementById('showcaseTag').innerHTML = `<i class="fas ${data.icon}"></i> ${data.tag}`;
        document.getElementById('showcaseTitle').textContent = data.title;

        const specsEl = document.getElementById('showcaseSpecs');
        specsEl.innerHTML = (data.specs || []).map(spec => `
          <span class="showcase-spec"><i class="fas ${spec.icon}"></i> ${spec.text}</span>
        `).join('');
      }

      function startAutoRotate(projects) {
        showcaseState.timer = setInterval(() => {
          const keys = showcaseState.projectKeys;
          const idx = keys.indexOf(showcaseState.currentKey);
          const next = keys[(idx + 1) % keys.length];
          updateShowcase(next, projects);
        }, 5000);
      }

      function resetAutoRotate(projects) {
        clearInterval(showcaseState.timer);
        startAutoRotate(projects);
      }

      /* ============================================================
         5. RENDU : SLIDER
         ============================================================ */
      function renderSlider(slider) {
        if (!slider) return;
        document.getElementById('sliderBadge').innerHTML = `<i class="fas fa-calculator"></i> ${slider.badge || ''}`;
        document.getElementById('sliderTitle').innerHTML = slider.title || '';
        document.getElementById('sliderSubtitle').textContent = slider.subtitle || '';
        document.getElementById('sliderCtaText').textContent = slider.cta_text || 'Devis gratuit';
        document.getElementById('sliderCta').setAttribute('href', slider.cta_link || 'devis.html');

        const range = document.getElementById('surfaceRange');
        range.min = slider.min || 20;
        range.max = slider.max || 500;
        range.step = slider.step || 10;
        range.value = slider.default || 120;

        initSlider();
      }

      function initSlider() {
        const range = document.getElementById('surfaceRange');
        const valEl = document.getElementById('surfaceValue');
        const durEl = document.getElementById('durationValue');

        function update() {
          const value = parseInt(range.value);
          const min = parseInt(range.min);
          const max = parseInt(range.max);
          const percent = ((value - min) / (max - min)) * 100;
          range.style.setProperty('--slider-percent', percent + '%');
          valEl.textContent = value;
          const months = Math.max(2, Math.round(2 + (value - 20) / 60));
          durEl.innerHTML = months + '<span>mois</span>';
        }

        range.addEventListener('input', update);
        update();
      }

      /* ============================================================
         6. RENDU : SERVICES
         ============================================================ */
      function renderServices(services) {
        if (!services) return;
        document.getElementById('servicesBadge').innerHTML = `<i class="fas fa-hard-hat"></i> ${services.badge || ''}`;
        document.getElementById('servicesTitle').innerHTML = services.title || '';
        document.getElementById('servicesSubtitle').textContent = services.subtitle || '';

        const grid = document.getElementById('servicesGrid');
        grid.innerHTML = (services.cards || []).map(c => `
          <div class="service-card" onclick="location.href='${c.link}'">
            <div class="card-number">${c.number}</div>
            <div class="card-icon"><i class="fas ${c.icon}"></i></div>
            <h3>${c.title}</h3>
            <p>${c.description}</p>
            <span class="card-link">Découvrir <i class="fas fa-arrow-right"></i></span>
          </div>
        `).join('');

        // Fade-in
        document.querySelectorAll('.service-card').forEach((el, i) => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(20px)';
          el.style.transition = `opacity 0.5s ${i * 0.08}s ease, transform 0.5s ${i * 0.08}s ease`;
          setTimeout(() => {
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
          }, 100);
        });
      }

      /* ============================================================
         7. RENDU : TRUST
         ============================================================ */
      function renderTrust(trust) {
        if (!trust) return;
        const grid = document.getElementById('trustGrid');
        grid.innerHTML = (trust.badges || []).map((b, i) => `
          <div class="trust-badge">
            <div class="trust-icon"><i class="fas ${b.icon}"></i></div>
            <div class="trust-value" ${b.suffix ? `data-count="${b.value}" data-suffix="${b.suffix}"` : ''}>${b.suffix ? '0' : b.value}</div>
            <div class="trust-label">${b.label}</div>
          </div>
        `).join('');

        // Compteurs animés
        const obs = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !entry.target.dataset.animated) {
              entry.target.dataset.animated = '1';
              animateCounter(entry.target);
            }
          });
        }, { threshold: 0.5 });

        document.querySelectorAll('[data-count]').forEach(el => obs.observe(el));
      }

      function animateCounter(el) {
        const target = parseInt(el.getAttribute('data-count'));
        const suffix = el.getAttribute('data-suffix') || '';
        const duration = 1500;
        const start = performance.now();
        function tick(now) {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          el.textContent = Math.floor(progress * target) + suffix;
          if (progress < 1) requestAnimationFrame(tick);
          else el.textContent = target + suffix;
        }
        requestAnimationFrame(tick);
      }

      /* ============================================================
         8. BOOT
         ============================================================ */
      async function boot() {
        const data = await loadIndexData();

        if (data) {
          renderHero(data.hero);
          renderSelector(data.selector);
          renderSlider(data.slider);
          renderServices(data.services);
          renderTrust(data.trust);
        } else {
          console.warn('⚠️ Données non chargées — page vide');
        }

        // Masquer le loader et afficher le contenu
        document.getElementById('pageLoader').style.display = 'none';
        document.getElementById('indexContent').classList.add('ready');
      }

      // Démarrage
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }

    })();
  </script>

</body>
</html>
